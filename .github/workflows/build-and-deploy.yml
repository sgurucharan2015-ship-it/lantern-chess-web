name: Build real Lantern and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lantern-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Lantern project
        uses: actions/checkout@v5
      - name: Configure Node.js for frontend checks
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Vendor legal chess rules for browser-local two-sided play
        shell: bash
        run: |
          curl --fail --location --retry 4 --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js \
            -o site/chess.js
          test -s site/chess.js
          node --check site/chess.js
          node -e "const C=require('./site/chess.js').Chess;const b=new C();if(b.moves().length!==20)process.exit(1);b.move('f3');b.move('e5');b.move('g4');b.move('Qh4#');if(!b.in_checkmate())process.exit(2);console.log('CHESS RULES: starting position and checkmate tests passed')"
      - name: Install Emscripten in GitHub's temporary runner (NOT your PC)
        shell: bash
        run: |
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 4.0.7
          ./emsdk activate 4.0.7
      - name: Compile the ORIGINAL Lantern C++ engine (three threads, 512 MB hash, H50 NNUE)
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          em++ --version
          bash build_web.sh 1
      - name: Verify engine assets and JavaScript
        run: |
          python3 verify_package.py --require-wasm
          python3 tests/check_release.py
      - name: Browser runtime smoke test (loads actual WASM and searches a move)
        shell: bash
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory site --bind 127.0.0.1 > /tmp/lantern-server.log 2>&1 &
          sleep 2
          node tests/browser_smoke.cjs
      - name: Preserve a deployable website ZIP as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lantern-ready-to-host
          path: site/
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled website for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Lantern to free GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
